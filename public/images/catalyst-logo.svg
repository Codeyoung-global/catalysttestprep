<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 50" width="280" height="50">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7CB886" />
      <stop offset="100%" stop-color="#2D6A4F" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="2" y="5" width="40" height="40" rx="10" ry="10" fill="url(#iconGrad)" />

  <!-- Upward chevron/arrow -->
  <polyline points="14,30 22,16 30,30" fill="none" stroke="#90EE90" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Small semi-circle at bottom -->
  <path d="M 18,35 A 4,4 0 0 1 26,35" fill="none" stroke="#90EE90" stroke-width="2.5" stroke-linecap="round" />

  <!-- "Catalyst" text -->
  <text x="52" y="34" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#1a1a1a">Catalyst</text>
</svg>
